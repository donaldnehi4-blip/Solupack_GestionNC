name: Déploiement GitHub Pages SOLUPACK SMQ

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation propre des dépendances
        run: npm ci

      - name: Validation TypeScript & Linting
        run: npm run lint

      - name: Compilation de l'application de production
        run: npm run build

      - name: Copie du fichier SPA fallback 404.html
        run: |
          if [ -f public/404.html ]; then
            cp public/404.html dist/404.html
          elif [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact de déploiement
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
